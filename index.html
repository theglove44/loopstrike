<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loopstrike">
<meta name="theme-color" content="#000000">
<title>Loopstrike</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--c:#4ff0ff;--g:#39ff88;--r:#ff4d6d;--y:#ffd24d;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;top:0;left:0;right:0;height:100%;color:#dff8ff;font-family:-apple-system,system-ui,sans-serif}
canvas{position:absolute;left:0;top:0;touch-action:none}
#safe{position:absolute;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);box-sizing:border-box;background:radial-gradient(ellipse at center,rgba(0,10,20,.55),rgba(0,0,0,.8))}
#ov.hide{display:none}
.panel{margin:auto;width:100%;max-width:420px}
.center{text-align:center}
.kicker{font:700 12px var(--mono);letter-spacing:.35em;color:var(--c);margin-bottom:10px}
.kicker.red{color:var(--r)}.kicker.green{color:var(--g)}
.logo{font:900 52px/0.95 var(--mono);letter-spacing:.06em;margin:0 0 14px;color:#effeff;text-shadow:0 0 10px var(--c),0 0 34px #08f}
h2{font:800 26px var(--mono);letter-spacing:.1em;margin:4px 0 16px;color:#effeff;text-shadow:0 0 12px rgba(79,240,255,.6)}
.rank{font:600 13px var(--mono);letter-spacing:.2em;color:#9fdfff;margin-bottom:16px}
.rank b{color:var(--y)}
.stats{display:flex;gap:8px;margin:0 0 16px}
.stats>div{flex:1;border:1px solid rgba(79,240,255,.25);border-radius:6px;padding:10px 4px;background:rgba(0,30,45,.45)}
.stats small{display:block;font:600 10px var(--mono);letter-spacing:.15em;color:#7fb8cc;margin-bottom:4px}
.stats b{font:800 16px var(--mono);color:#fff}
.btn{display:block;width:100%;margin:10px 0;padding:15px 10px;border:1px solid var(--c);background:rgba(0,40,60,.6);color:#effeff;font:800 16px var(--mono);letter-spacing:.18em;border-radius:6px;box-shadow:inset 0 0 14px rgba(79,240,255,.2);cursor:pointer}
.btn:active{background:rgba(79,240,255,.3)}
.btn.primary{background:linear-gradient(180deg,rgba(79,240,255,.35),rgba(0,90,130,.5));box-shadow:0 0 18px rgba(79,240,255,.45),inset 0 0 12px rgba(255,255,255,.2)}
.btn.ghost{border-color:rgba(79,240,255,.3);background:transparent;font-size:13px;padding:11px}
.btn.danger{border-color:var(--r);color:#ffd0d8;background:rgba(80,0,20,.4)}
.dot{color:var(--g)}
.lbl{font:700 11px var(--mono);letter-spacing:.2em;color:#7fb8cc;margin:4px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:6px}
.chip{min-width:48px;padding:9px 10px;border:1px solid rgba(79,240,255,.4);background:rgba(0,30,45,.5);color:#cfefff;font:800 14px var(--mono);border-radius:5px}
.chip.on{background:var(--c);color:#001018;box-shadow:0 0 12px var(--c)}
.toggles{display:flex;gap:8px;margin-top:6px}
.toggles button{flex:1;padding:10px;border:1px solid rgba(79,240,255,.25);background:transparent;color:#9fdfff;font:700 12px var(--mono);letter-spacing:.12em;border-radius:5px}
.foot{font:600 11px var(--mono);letter-spacing:.2em;color:#5f8a99;margin-top:14px}
.card{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px;border:1px solid var(--g);background:rgba(0,40,20,.6);color:#eafff2;border-radius:8px;box-shadow:inset 0 0 16px rgba(57,255,136,.15);font-family:var(--mono)}
.card:active{background:rgba(57,255,136,.3)}
.card b{display:block;font-size:17px;letter-spacing:.08em;margin-bottom:4px;color:#b9ffd6}
.card small{display:block;font-size:13px;color:#cfe;line-height:1.35}
.card em{display:block;font-style:normal;font-size:14px;font-weight:800;color:#ffd24d;margin-top:7px}
.card i{display:block;font-style:normal;font-size:11px;letter-spacing:.15em;color:#6fcf95;margin-top:6px}
.earn{font:800 20px var(--mono);color:var(--g);margin:6px 0 4px;text-shadow:0 0 12px rgba(57,255,136,.6)}
.newbest{font:800 14px var(--mono);letter-spacing:.25em;color:var(--y);margin:-6px 0 14px;animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.tip{font-size:14px;line-height:1.45;color:#a9cfdc;margin:12px 4px 10px}
.hhead{display:flex;justify-content:space-between;align-items:baseline}
.bal{font:800 20px var(--mono);color:var(--g)}
.sub{font-size:13px;color:#8fb8c8;margin:-8px 0 12px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(79,240,255,.12)}
.row .info{flex:1;min-width:0}
.row b{font:800 14px var(--mono);letter-spacing:.06em;color:#effeff}
.row small{display:block;font-size:12px;color:#8fb8c8;margin:2px 0 5px}
.pips{display:flex;gap:3px}
.pips i{width:12px;height:5px;background:rgba(79,240,255,.15);border-radius:1px}
.pips i.on{background:var(--c);box-shadow:0 0 6px var(--c)}
.buy{min-width:84px;padding:10px 8px;border:1px solid var(--g);background:rgba(0,50,25,.6);color:#d9ffe8;font:800 13px var(--mono);border-radius:5px}
.buy:disabled{border-color:#335;color:#567;background:transparent}
.loadout{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;text-align:left;margin:0 0 12px;font:12px var(--mono)}
.loadout div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(79,240,255,.12);padding:4px 0}
.loadout span{color:#8fb8c8}.loadout b{color:#effeff}
.how{text-align:left;font-size:15px;line-height:1.5;color:#cfeaf2;padding-left:20px}
.how li{margin-bottom:9px}
.how b{color:var(--c)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="ov"></div>
<script>
'use strict';
// ---------- basics ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const ov = document.getElementById('ov');
const TAU = Math.PI * 2, MONO = 'ui-monospace,"SF Mono",Menlo,monospace';
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fmt = n => Math.floor(n).toLocaleString('en-GB');
const pct = m => Math.round(m * 100) + '%';

let W = 0, H = 0, DPR = 1, FW = 0, FX = 0, SAFE = { t: 0, b: 0, l: 0, r: 0 };
let pauseBtn = {}, btBtn = {};
let mode = 'title', G = null, clock = 0, frameDt = 0;

// ---------- save data (per device, in browser storage) ----------
const SAVE_KEY = 'loopstrike.v1';
const defSave = () => ({ data: 0, best: 0, bestSector: 0, loops: 0, kills: 0, up: {}, cps: [1], muted: false, music: true });
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) return Object.assign(defSave(), s); } catch (e) {}
  return defSave();
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
let save = loadSave();
let startSel = save.cps[save.cps.length - 1];

// ---------- permanent (hangar) and per-run upgrades ----------
const HANGAR = [
  { id: 'dmg', name: 'Plasma Cannons', desc: '+15% damage', max: 10, base: 40 },
  { id: 'rate', name: 'Cyclic Loader', desc: '+8% fire rate', max: 10, base: 40 },
  { id: 'hull', name: 'Hull Plating', desc: '+1 starting hull', max: 5, base: 120 },
  { id: 'shield', name: 'Deflector', desc: 'Shield absorbs a hit, recharges faster per level', max: 5, base: 150 },
  { id: 'chrono', name: 'Chrono Core', desc: 'Longer bullet time, faster charge', max: 5, base: 100 },
  { id: 'magnet', name: 'Tractor Beam', desc: 'Wider pickup range', max: 5, base: 60 },
  { id: 'salvage', name: 'Salvage Protocol', desc: '+10% loop data banked', max: 10, base: 80 },
  { id: 'twin', name: 'Twin Emitters', desc: 'Start every loop with +1 laser', max: 2, base: 600 },
];
const lvl = id => save.up[id] || 0;
const cost = u => Math.round(u.base * Math.pow(1.55, lvl(u.id)));

const PERKS = [
  // tag: short label for the in-game loadout strip. stat: "now → after" line shown on the upgrade card.
  { id: 'streams', tag: 'BEAM', name: 'Split Beam', desc: 'Fire an extra laser in a wider fan', max: 4, apply: p => p.streams++, stat: p => `Lasers ${p.streams} → ${p.streams + 1}` },
  { id: 'power', tag: 'DMG', name: 'Overcharge', desc: '+25% damage. Shots grow bigger and change colour', max: 99, apply: p => p.dmg *= 1.25, stat: p => `Damage ${pct(p.dmg)} → ${pct(p.dmg * 1.25)}` },
  { id: 'rapid', tag: 'RATE', name: 'Rapid Cycle', desc: '+18% fire rate', max: 99, apply: p => p.rate *= 1.18, stat: p => `Shots/sec ${p.rate.toFixed(1)} → ${(p.rate * 1.18).toFixed(1)}` },
  { id: 'repair', name: 'Field Repair', desc: 'Restore 2 hull', max: 99, apply: p => p.hp = Math.min(p.maxHp, p.hp + 2), cond: p => p.hp < p.maxHp, stat: p => `Hull ${p.hp} → ${Math.min(p.maxHp, p.hp + 2)}` },
  { id: 'plating', tag: 'ARMR', name: 'Ablative Armour', desc: '+1 max hull and repair 1', max: 4, apply: p => { p.maxHp++; p.hp++; }, stat: p => `Max hull ${p.maxHp} → ${p.maxHp + 1}` },
  { id: 'missiles', tag: 'MSL', name: 'Seeker Pods', desc: 'Homing missiles launch automatically', max: 4, apply: p => p.missiles++, stat: p => `Missiles per volley ${p.missiles} → ${p.missiles + 1}` },
  { id: 'wing', tag: 'WING', name: 'Wingman Drone', desc: 'An escort ship that flies and fires beside you', max: 2, apply: p => p.wings++, stat: p => `Escorts ${p.wings} → ${p.wings + 1}` },
  { id: 'pierce', tag: 'PHASE', name: 'Phase Rounds', desc: 'Shots pass through enemies. Violet trails show it', max: 3, apply: p => p.pierce++, stat: p => `Enemies per shot ${p.pierce + 1} → ${p.pierce + 2}` },
  { id: 'tcell', tag: 'TIME', name: 'Temporal Cell', desc: 'Bullet time charges 40% faster', max: 3, apply: p => p.btGain *= 1.4, stat: p => `Charge speed ${pct(p.btGain)} → ${pct(p.btGain * 1.4)}` },
  { id: 'greed', tag: 'DATA', name: 'Data Siphon', desc: '+30% loop data from kills', max: 3, apply: p => p.greed *= 1.3, stat: p => `Data per kill ${pct(p.greed)} → ${pct(p.greed * 1.3)}` },
];

const RANKS = [[0, 'Cadet'], [3, 'Ensign'], [6, 'Lieutenant'], [11, 'Commander'], [16, 'Captain'], [21, 'Commodore'], [26, 'Admiral'], [36, 'The One']];
const rankName = () => { let r = RANKS[0][1]; for (const [s, n] of RANKS) if (save.bestSector >= s) r = n; return r; };
const SECTOR_NAMES = ['Outer Rim', 'Kobol Drift', 'Neutral Zone', 'Zion Deep', 'Verdun Shore', 'Ion Storm', 'Red Line', 'Kessel Verge', 'Tycho Belt', 'Mimic Hive', 'Caprica Wake', 'Dead Signal', 'Omega Veil', 'Event Horizon', 'The Source'];
const sectorName = s => { const n = SECTOR_NAMES.length, lap = Math.floor((s - 1) / n) + 1; return SECTOR_NAMES[(s - 1) % n] + (lap > 1 ? ' ' + (['', '', 'II', 'III', 'IV', 'V'][lap] || lap) : ''); };
const TIPS = [
  'Agents sidestep your fire. In bullet time they are too slow to dodge.',
  'Darts lock on to where you were. Move once the pink line appears.',
  'Chain kills to build a score multiplier. Taking a hit resets it.',
  'Beat a boss to unlock a checkpoint for future loops.',
  'Your real hitbox is the small white dot at the ship’s core.',
  'Mines burst into a ring of shots when destroyed. Kill them from a distance.',
  'Starting from a checkpoint restores some upgrades from loop memory.',
  'Deeper sectors drop more loop data per kill.',
];

// ---------- enemies ----------
const EDEF = {
  drone:    { hp: 1,   r: 13, score: 10, data: 1, col: '#ff6a3d' },
  raider:   { hp: 2,   r: 14, score: 20, data: 2, col: '#ff3355' },
  dart:     { hp: 1.5, r: 11, score: 25, data: 2, col: '#ff4fd8' },
  gunship:  { hp: 5,   r: 19, score: 50, data: 4, col: '#ffae42' },
  splitter: { hp: 7,   r: 20, score: 60, data: 4, col: '#ffe14d' },
  mine:     { hp: 3,   r: 14, score: 40, data: 3, col: '#ff66aa' },
  agent:    { hp: 4,   r: 14, score: 80, data: 6, col: '#5cff5c' },
};
const BOSSES = [
  { name: 'BASESTAR', r: 60, spr: 'basestar' },
  { name: 'DREADNOUGHT', r: 70, spr: 'dread' },
  { name: 'SENTINEL CORE', r: 44, spr: 'sentinel' },
];

// ---------- sprites (pre-rendered glow shapes) ----------
const SPR = {};
function sprite(w, h, glow, fn) {
  const pad = glow + 4, S = 2, c = document.createElement('canvas');
  c.width = (w + pad * 2) * S; c.height = (h + pad * 2) * S;
  const x = c.getContext('2d'); x.scale(S, S); x.translate(pad + w / 2, pad + h / 2); fn(x);
  return { c, w: w + pad * 2, h: h + pad * 2 };
}
function glowPath(x, col, glow, fill, path, lw = 2) {
  x.shadowColor = col; x.shadowBlur = glow; x.strokeStyle = col; x.lineWidth = lw; x.fillStyle = fill;
  x.beginPath(); path(x); x.closePath(); x.fill(); x.stroke(); x.shadowBlur = 0; x.stroke();
}
function poly(pts) { return q => pts.forEach((p, i) => i ? q.lineTo(p[0], p[1]) : q.moveTo(p[0], p[1])); }
function spr(s, x, y, rot = 0, sc = 1) {
  const w = s.w * sc, h = s.h * sc;
  if (rot) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.drawImage(s.c, -w / 2, -h / 2, w, h); ctx.restore(); }
  else ctx.drawImage(s.c, x - w / 2, y - h / 2, w, h);
}
function buildSprites() {
  SPR.ship = sprite(36, 40, 10, x => {
    glowPath(x, '#4ff0ff', 10, 'rgba(0,45,70,.95)', poly([[0, -20], [5, -6], [17, 8], [17, 14], [6, 10], [4, 16], [-4, 16], [-6, 10], [-17, 14], [-17, 8], [-5, -6]]));
    x.fillStyle = '#bff8ff'; x.beginPath(); x.ellipse(0, -3, 2.5, 5, 0, 0, TAU); x.fill();
    x.fillStyle = '#ff6a3d'; x.fillRect(-16, 9, 4, 2); x.fillRect(12, 9, 4, 2);
  });
  SPR.wing = sprite(16, 18, 8, x => glowPath(x, '#4ff0ff', 8, 'rgba(0,45,70,.95)', poly([[0, -9], [8, 8], [0, 4], [-8, 8]])));
  SPR.drone = sprite(26, 26, 8, x => {
    glowPath(x, '#ff6a3d', 8, 'rgba(60,15,5,.9)', poly([[0, 12], [12, -8], [0, -3], [-12, -8]]));
    x.fillStyle = '#ffd0b0'; x.beginPath(); x.arc(0, 0, 2.5, 0, TAU); x.fill();
  });
  SPR.raider = sprite(36, 24, 8, x => {
    glowPath(x, '#ff3355', 8, 'rgba(50,8,15,.92)', q => { q.moveTo(-18, -8); q.quadraticCurveTo(0, -2, 18, -8); q.lineTo(11, 9); q.quadraticCurveTo(0, 3, -11, 9); });
    x.fillStyle = '#100'; x.fillRect(-9, -4, 18, 4);
  });
  SPR.dart = sprite(18, 28, 8, x => glowPath(x, '#ff4fd8', 8, 'rgba(50,5,45,.9)', poly([[0, 14], [8, -12], [0, -6], [-8, -12]])));
  SPR.gunship = sprite(46, 32, 10, x => {
    glowPath(x, '#ffae42', 10, 'rgba(55,30,5,.92)', poly([[-23, -6], [-12, -14], [12, -14], [23, -6], [14, 12], [-14, 12]]));
    x.strokeStyle = '#ffd08a'; x.lineWidth = 2; x.beginPath(); x.moveTo(-6, 12); x.lineTo(-6, 16); x.moveTo(6, 12); x.lineTo(6, 16); x.stroke();
    x.fillStyle = '#ffe0a0'; x.fillRect(-4, -6, 8, 6);
  });
  const hex = r => poly([0, 1, 2, 3, 4, 5].map(i => [Math.cos(i / 6 * TAU) * r, Math.sin(i / 6 * TAU) * r]));
  SPR.splitter = sprite(42, 42, 10, x => {
    glowPath(x, '#ffe14d', 10, 'rgba(50,40,5,.92)', hex(20));
    x.strokeStyle = '#ffe14d'; x.lineWidth = 1.5; x.beginPath(); hex(10)(x); x.closePath(); x.stroke();
  });
  SPR.mine = sprite(32, 32, 8, x => {
    glowPath(x, '#ff66aa', 8, 'rgba(60,10,35,.9)', poly([...Array(16)].map((_, i) => { const a = i / 16 * TAU, r = i % 2 ? 9 : 15; return [Math.cos(a) * r, Math.sin(a) * r]; })));
    x.fillStyle = '#ffc0e0'; x.beginPath(); x.arc(0, 0, 3, 0, TAU); x.fill();
  });
  SPR.agent = sprite(28, 34, 10, x => {
    glowPath(x, '#5cff5c', 10, 'rgba(0,25,5,.95)', poly([[0, -17], [13, 0], [0, 17], [-13, 0]]));
    x.fillStyle = '#000'; x.fillRect(-9, -4, 18, 5); x.fillStyle = '#5cff5c'; x.fillRect(-9, -4, 18, 1);
  });
  // One laser bolt per Overcharge tier: cyan, green, gold, magenta.
  SPR.pb = ['#4ff0ff', '#6dff9e', '#ffd24d', '#ff5cf0'].map(col => sprite(5, 16, 7, x => {
    x.shadowColor = col; x.shadowBlur = 7; x.fillStyle = col;
    x.beginPath(); x.moveTo(0, -8); x.lineTo(2.5, -5); x.lineTo(2.5, 8); x.lineTo(-2.5, 8); x.lineTo(-2.5, -5); x.closePath(); x.fill();
    x.shadowBlur = 0; x.fillStyle = 'rgba(255,255,255,.85)'; x.fillRect(-1, -5, 2, 12);
  }));
  const orb = (r, col) => sprite(r * 2, r * 2, 8, x => {
    x.shadowColor = col; x.shadowBlur = 8; x.fillStyle = col; x.beginPath(); x.arc(0, 0, r, 0, TAU); x.fill();
    x.shadowBlur = 0; x.fillStyle = '#fff'; x.beginPath(); x.arc(0, 0, r * 0.45, 0, TAU); x.fill();
  });
  SPR.eb = orb(5, '#ff3d7f'); SPR.ebBig = orb(7, '#ffa040');
  SPR.missile = sprite(6, 12, 6, x => glowPath(x, '#fff38a', 6, '#fff9c0', poly([[0, -6], [3, 6], [-3, 6]]), 1));
  SPR.data = sprite(12, 12, 6, x => glowPath(x, '#39ffb0', 6, 'rgba(0,60,40,.9)', poly([[0, -6], [6, 0], [0, 6], [-6, 0]])));
  SPR.heal = sprite(18, 18, 8, x => glowPath(x, '#ffffff', 8, 'rgba(0,90,50,.95)', poly([[-3, -9], [3, -9], [3, -3], [9, -3], [9, 3], [3, 3], [3, 9], [-3, 9], [-3, 3], [-9, 3], [-9, -3], [-3, -3]]), 1.5));
  SPR.chrono = sprite(18, 18, 8, x => glowPath(x, '#7dff9a', 8, 'rgba(0,50,20,.95)', poly([[-7, -9], [7, -9], [0, 0], [7, 9], [-7, 9], [0, 0]]), 1.5));
  SPR.basestar = sprite(150, 150, 14, x => {
    for (let i = 0; i < 3; i++) {
      x.save(); x.rotate(i * TAU / 3);
      glowPath(x, '#ff4455', 12, 'rgba(40,10,14,.96)', poly([[-14, -8], [-24, -70], [24, -70], [14, -8]]));
      x.strokeStyle = 'rgba(255,90,100,.5)'; x.lineWidth = 1; x.beginPath();
      x.moveTo(-17, -30); x.lineTo(17, -30); x.moveTo(-20, -50); x.lineTo(20, -50); x.moveTo(0, -12); x.lineTo(0, -66); x.stroke();
      x.restore();
    }
    glowPath(x, '#ff4455', 12, 'rgba(60,15,20,1)', q => q.arc(0, 0, 22, 0, TAU));
  });
  SPR.dread = sprite(200, 100, 14, x => {
    glowPath(x, '#ffae42', 14, 'rgba(18,24,36,.97)', poly([[0, 50], [-100, -38], [-62, -50], [62, -50], [100, -38]]));
    x.strokeStyle = 'rgba(255,190,110,.35)'; x.lineWidth = 1; x.beginPath();
    x.moveTo(0, 46); x.lineTo(0, -50); x.moveTo(-70, -22); x.lineTo(70, -22); x.moveTo(-40, 5); x.lineTo(40, 5); x.stroke();
    glowPath(x, '#ffd08a', 6, 'rgba(40,40,50,1)', q => q.rect(-14, -50, 28, 14));
  });
  SPR.sentinel = sprite(96, 96, 16, x => {
    glowPath(x, '#ff3030', 14, 'rgba(30,5,5,.97)', q => q.arc(0, 0, 40, 0, TAU));
    for (let i = 0; i < 7; i++) {
      const a = i / 7 * TAU, r = i ? 22 : 0;
      x.shadowColor = '#f00'; x.shadowBlur = 10; x.fillStyle = '#ff4040';
      x.beginPath(); x.arc(Math.cos(a) * r, Math.sin(a) * r, i ? 5 : 9, 0, TAU); x.fill();
    }
    x.shadowBlur = 0;
  });
}

// ---------- background: nebula, stars, code rain ----------
let neb = null, stars = [], rain = [];

// ---------- enemy + boss behaviour ----------
function updEnemy(e, dt) {

      break;

        if (e.burst > 0) { e.bT -= dt; if (e.bT <= 0) { aimShot(e, 230); e.burst--; e.bT = 0.13; } }
        if (e.t > 14) e.y += 120 * dt;

// ---------- effects ----------

// ---------- main game update ----------
const keys = {};
function movePlayer(dx, dy, raw) {
  if (!G) return; const p = G.p, k = raw ? 1 : 1.35;
  p.x = clamp(p.x + dx * k, 14, FW - 14); p.y = clamp(p.y + dy * k, SAFE.t + 70, H - SAFE.b - 24);
}
function updateGame(dt) {
  const g = G, p = g.p;

  g.t += wdt; g.shake = Math.max(0, g.shake - dt * 30); g.flash = Math.max(0, g.flash - dt * 2); g.hurt = Math.max(0, g.hurt - dt);
  pickSfxT -= dt;

  const alive = mode === 'play';

    const kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    const ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    if (kx || ky) movePlayer(kx * 380 * dt, ky * 380 * dt, true);
  }
  if (alive) {
    p.inv = Math.max(0, p.inv - dt);
    if (p.shieldMax && !p.shield) { p.shieldT -= dt; if (p.shieldT <= 0) { p.shield = 1; sfx('shield'); } }
    p.fireT -= dt;
    if (p.fireT <= 0) { p.fireT += 1 / p.rate; if (p.fireT < 0) p.fireT = 0; firePlayer(); }
    if (p.missiles) {
      p.missileT -= dt;
      if (p.missileT <= 0) { p.missileT = 1.3; for (let i = 0; i < p.missiles; i++) g.pb.push({ x: p.x, y: p.y, vx: rand(-160, 160), vy: -180, dmg: p.dmg * 3, pierce: 0, missile: true, life: 3 }); }
    }
  }
  if (mode === 'warp') { g.warp -= dt; if (g.warp <= 0) { g.warp = 0; g.sector++; mode = 'play'; g.flash = 0.6; beginSector(); } }
  if (alive && !g.isBoss && g.toSpawn > 0) { g.spawnT -= wdt; if (g.spawnT <= 0) spawnGroup(); }
  for (const e of g.enemies) updEnemy(e, wdt);

      for (const e of g.enemies) { if (e.dead || e.y < 0) continue; const d = (e.x - b.x) ** 2 + (e.y - b.y) ** 2; if (d < bd) { bd = d; tgt = e; } }
      if (!tgt && g.boss && !g.boss.enter) tgt = g.boss;
      if (tgt) { const a = Math.atan2(tgt.y - b.y, tgt.x - b.x); b.vx += (Math.cos(a) * 520 - b.vx) * Math.min(1, dt * 4); b.vy += (Math.sin(a) * 520 - b.vy) * Math.min(1, dt * 4); }

  }
  for (const b of g.eb) { b.x += b.vx * wdt; b.y += b.vy * wdt; if (b.y < -40 || b.y > H + 40 || b.x < -40 || b.x > FW + 40) b.dead = true; }

  // Collisions: player shots vs enemies and boss.

    if (b.dead) continue;
    for (const e of g.enemies) {
      if (e.dead || e.y < -10 || (b.hits && b.hits.includes(e))) continue;
      const dx = e.x - b.x, dy = e.y - b.y, rr = e.r + (b.missile ? 6 : 4);

    }
  }

  }
  if (mode === 'play' && p.inv <= 0) {
    for (const e of g.enemies) { if (e.dead) continue; const dx = e.x - p.x, dy = e.y - p.y, rr = e.r * 0.8 + p.r + 4; if (dx * dx + dy * dy < rr * rr) { killEnemy(e); hurtPlayer(); break; } }
  }

    k.x += k.vx * dt; k.y += k.vy * dt;

  }

  for (const t of g.texts) { t.life -= dt; t.y -= 30 * dt; }
  if (g.comboT > 0) { g.comboT -= dt; if (g.comboT <= 0) { g.combo = 0; g.mult = 1; } }

  g.enemies = g.enemies.filter(e => !e.dead && !e.gone);
  g.pb = g.pb.filter(b => !b.dead); g.eb = g.eb.filter(b => !b.dead);
  g.picks = g.picks.filter(k => !k.dead); g.parts = g.parts.filter(q => q.life > 0); g.texts = g.texts.filter(t => t.life > 0);

    if (done) {
      g.cleared = true; g.clearT = g.isBoss ? 2.4 : 1.5;
      const bonus = 5 * g.sector; g.dataRun += bonus;
      if (!g.isBoss) banner('SECTOR CLEAR', '+' + bonus + ' LOOP DATA', '#39ff88', 1.6);

    }
  }
  if (g.cleared && mode === 'play') { g.clearT -= dt; if (g.clearT <= 0) openPerks(); }
  if (mode === 'dying') { g.dieT -= dt; if (g.dieT <= 0) gameOver(); }
}

// ---------- drawing ----------

  if (FX > 0) { ctx.strokeStyle = 'rgba(79,240,255,.15)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, H); ctx.moveTo(FW, 0); ctx.lineTo(FW, H); ctx.stroke(); }

  }

}
function drawPicks() {

}

  for (let i = 0; i < p.wings; i++) { const [wx, wy] = wingPos(i); spr(SPR.wing, wx, wy); }
  if (p.shield) { ctx.strokeStyle = `rgba(120,220,255,${0.35 + 0.2 * Math.sin(clock * 5)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 25, 0, TAU); ctx.stroke(); }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, TAU); ctx.fill();
}
function drawParts() {
  ctx.globalCompositeOperation = 'lighter';
  for (const q of G.parts) {
    const a = Math.max(0, q.life / q.max); ctx.globalAlpha = a;
    if (q.ring) { ctx.strokeStyle = q.col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q.x, q.y, q.r + (q.R - q.r) * (1 - a), 0, TAU); ctx.stroke(); }
    else if (q.ghost) spr(SPR.agent, q.x, q.y);
    else { ctx.fillStyle = q.col; ctx.fillRect(q.x - q.sz / 2, q.y - q.sz / 2, q.sz, q.sz); }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of G.texts) { ctx.globalAlpha = Math.min(1, t.life * 2); ctx.font = `800 ${t.size}px ${MONO}`; ctx.fillStyle = t.col; ctx.fillText(t.txt, t.x, t.y); }
  ctx.globalAlpha = 1;
}
function drawHUD() {
  const g = G, p = g.p, top = SAFE.t + 10, L = SAFE.l + 14, R = W - SAFE.r - 14;
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.font = `800 20px ${MONO}`; ctx.fillStyle = '#e8fbff'; ctx.fillText(fmt(g.score), L, top);
  ctx.font = `700 11px ${MONO}`; ctx.fillStyle = '#7fd8ff'; ctx.fillText('SECTOR ' + g.sector + (g.isBoss ? ' · BOSS' : ''), L, top + 25);
  // Hull pips shrink so a big hull never runs into the centre of the HUD.
  const pip = Math.min(15, 130 / p.maxHp);
  for (let i = 0; i < p.maxHp; i++) {
    ctx.fillStyle = i < p.hp ? '#4ff0ff' : 'rgba(79,240,255,.15)'; ctx.fillRect(L + i * pip, top + 43, pip * 0.73, 6);
  }
  if (p.shieldMax) {
    const sx = L + p.maxHp * pip + 8;
    ctx.strokeStyle = p.shield ? '#7fe8ff' : 'rgba(127,232,255,.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, top + 46, 5, 0, TAU); ctx.stroke();
    if (!p.shield) { ctx.beginPath(); ctx.moveTo(sx, top + 46); ctx.arc(sx, top + 46, 5, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - p.shieldT / p.shieldCd)); ctx.fillStyle = 'rgba(127,232,255,.5)'; ctx.fill(); }
  }
  // Pause button and loop data counter.
  const pb = pauseBtn;
  ctx.strokeStyle = 'rgba(79,240,255,.5)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(pb.x, pb.y, 18, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#bff4ff'; ctx.fillRect(pb.x - 6, pb.y - 7, 4, 14); ctx.fillRect(pb.x + 2, pb.y - 7, 4, 14);
  ctx.textAlign = 'right'; ctx.font = `800 14px ${MONO}`; ctx.fillStyle = '#39ffb0'; ctx.fillText('◆ ' + fmt(g.dataRun), pb.x - 28, pb.y - 8);
  // Combo multiplier.
  if (g.combo > 2) {
    ctx.textAlign = 'center'; ctx.font = `900 22px ${MONO}`; ctx.fillStyle = g.mult > 1 ? '#ffd24d' : 'rgba(255,210,77,.6)';
    ctx.fillText('x' + g.mult, W / 2, top); ctx.font = `700 10px ${MONO}`; ctx.fillText(g.combo + ' CHAIN', W / 2, top + 25);
    ctx.fillStyle = 'rgba(255,210,77,.7)'; ctx.fillRect(W / 2 - 30, top + 39, 60 * (g.comboT / 2.6), 3);
  }
  // Boss health bar.
  const B = g.boss;
  if (B) {
    const bw = Math.min(W * 0.7, 360), bx = (W - bw) / 2, by = top + 64;
    ctx.textAlign = 'center'; ctx.font = `800 11px ${MONO}`; ctx.fillStyle = '#ff8a9a'; ctx.fillText(B.name, W / 2, by - 15);
    ctx.fillStyle = 'rgba(255,60,80,.18)'; ctx.fillRect(bx, by, bw, 7);
    ctx.fillStyle = '#ff4d6d'; ctx.fillRect(bx, by, bw * Math.max(0, B.hp / B.maxHp), 7);
  }
  // Loadout strip (bottom left): every run upgrade you hold, with its level.
  const owned = PERKS.filter(k => k.tag && p.perks[k.id]);
  if (owned.length) {
    ctx.font = `800 10px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const maxX = btBtn.x - btBtn.r - 12; let cx = L, cy = H - SAFE.b - 22;
    for (const k of owned.slice().reverse()) {
      const label = k.tag + ' ' + p.perks[k.id], w = ctx.measureText(label).width + 12;
      if (cx + w > maxX) { cx = L; cy -= 22; }
      ctx.fillStyle = 'rgba(0,40,25,.7)'; ctx.fillRect(cx, cy - 9, w, 18);
      ctx.strokeStyle = 'rgba(57,255,136,.55)'; ctx.lineWidth = 1; ctx.strokeRect(cx + 0.5, cy - 8.5, w - 1, 17);
      ctx.fillStyle = '#b9ffd6'; ctx.fillText(label, cx + 6, cy + 1); cx += w + 6;
    }
  }
  // Bullet-time button.
  const b = btBtn, ch = p.btCharge, active = g.bt > 0, ready = ch >= 1 && !active;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU);
  ctx.fillStyle = ready || active ? `rgba(57,255,136,${0.18 + 0.12 * Math.sin(clock * 8)})` : 'rgba(0,30,20,.5)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(57,255,136,.25)'; ctx.stroke();
  ctx.strokeStyle = '#39ff88'; ctx.lineWidth = 4; ctx.beginPath();
  ctx.arc(b.x, b.y, b.r - 2, -Math.PI / 2, -Math.PI / 2 + TAU * (active ? g.bt / p.btDur : ch)); ctx.stroke();
  ctx.strokeStyle = ready || active ? '#caffdf' : '#3a6a50'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(b.x - 8, b.y - 11); ctx.lineTo(b.x + 8, b.y - 11); ctx.lineTo(b.x - 8, b.y + 11); ctx.lineTo(b.x + 8, b.y + 11); ctx.closePath(); ctx.stroke();
  if (ready) { ctx.textAlign = 'center'; ctx.font = `800 10px ${MONO}`; ctx.fillStyle = '#39ff88'; ctx.fillText('BULLET TIME', b.x - 10, b.y - b.r - 16); }
  // Centre banner.
  if (g.banner) {
    const bn = g.banner, a = clamp(Math.min(bn.t / 0.4, (bn.dur - bn.t) / 0.3), 0, 1);
    ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 26px ${MONO}`; ctx.fillStyle = bn.col; ctx.shadowColor = bn.col; ctx.shadowBlur = 14;
    ctx.fillText(bn.text, W / 2, H * 0.36); ctx.shadowBlur = 0;
    if (bn.sub) { ctx.font = `700 12px ${MONO}`; ctx.fillStyle = '#b8e8ff'; ctx.fillText(bn.sub, W / 2, H * 0.36 + 32); }
    ctx.globalAlpha = 1;
  }
}

// ---------- screens (HTML overlays) ----------
function showOverlay(html) { ov.innerHTML = html; ov.classList.remove('hide'); ov.scrollTop = 0; }
function hideOverlay() { ov.classList.add('hide'); ov.innerHTML = ''; }
const canAfford = () => HANGAR.some(u => lvl(u.id) < u.max && save.data >= cost(u));
const toggles = () => `<div class="toggles"><button data-act="snd">SFX: ${save.muted ? 'OFF' : 'ON'}</button><button data-act="mus">MUSIC: ${save.music ? 'ON' : 'OFF'}</button></div>`;
function showTitle() {
  mode = 'title'; if (!save.cps.includes(startSel)) startSel = save.cps[save.cps.length - 1];
  makeNebula(1);
  showOverlay(`<div class="panel center">
    <div class="kicker">DIE · LEARN · LOOP</div>
    <h1 class="logo">LOOP<br>STRIKE</h1>
    <div class="rank">RANK: <b>${rankName().toUpperCase()}</b></div>
    <div class="stats"><div><small>BEST</small><b>${fmt(save.best)}</b></div><div><small>FURTHEST</small><b>${save.bestSector ? 'SEC ' + save.bestSector : '—'}</b></div><div><small>LOOP DATA</small><b style="color:#39ffb0">◆ ${fmt(save.data)}</b></div></div>
    ${save.cps.length > 1 ? `<div class="lbl">LAUNCH FROM SECTOR</div><div class="chips">${save.cps.map(c => `<button class="chip ${c === startSel ? 'on' : ''}" data-act="cp:${c}">${c}</button>`).join('')}</div>` : ''}
    <button class="btn primary" data-act="launch">LAUNCH</button>
    <button class="btn" data-act="hangar">HANGAR${canAfford() ? ' <span class="dot">●</span>' : ''}</button>
    <button class="btn ghost" data-act="how">HOW TO PLAY</button>
    ${toggles()}
    <div class="foot">LOOP #${save.loops + 1} · ${fmt(save.kills)} KILLS ALL-TIME</div>
  </div>`);
}
function showHow() {
  mode = 'how';
  showOverlay(`<div class="panel"><h2>HOW TO PLAY</h2><ul class="how">
    <li><b>Drag anywhere</b> to fly. Your finger doesn’t need to be on the ship. You fire automatically.</li>
    <li>Kill enemies to collect green <b>loop data</b>. Chain kills to build a score multiplier.</li>
    <li>When the green ring fills, tap <b>⧗ bullet time</b> (bottom right). Everything slows except you.</li>
    <li>Clear a sector, then <b>pick an upgrade</b>. Every 5th sector is a boss.</li>
    <li>When you die, the loop resets. <b>Spend loop data in the Hangar</b> on permanent upgrades, then go further.</li>
    <li>Beating a boss unlocks a <b>checkpoint</b> to start future loops from.</li>
  </ul><button class="btn" data-act="title">BACK</button></div>`);
}
function showHangar() {
  mode = 'hangar';
  const row = u => {
    const L = lvl(u.id), maxed = L >= u.max, c = cost(u);
    return `<div class="row"><div class="info"><b>${u.name}</b><small>${u.desc}</small><div class="pips">${[...Array(u.max)].map((_, i) => `<i class="${i < L ? 'on' : ''}"></i>`).join('')}</div></div>
      <button class="buy" data-act="buy:${u.id}" ${maxed || save.data < c ? 'disabled' : ''}>${maxed ? 'MAX' : '◆ ' + fmt(c)}</button></div>`;
  };
  showOverlay(`<div class="panel"><div class="hhead"><h2>HANGAR</h2><div class="bal">◆ ${fmt(save.data)}</div></div>
    <p class="sub">Permanent upgrades. They carry over into every loop.</p>
    ${HANGAR.map(row).join('')}
    <button class="btn primary" data-act="launch">LAUNCH</button>
    <button class="btn ghost" data-act="title">BACK</button></div>`);
}
function openPerks() {
  const g = G, p = g.p;
  // Hoover up any remaining pickups before the jump.
  for (const k of g.picks) if (!k.dead) collect(k);
  g.picks = []; g.eb = [];
  const pool = eligiblePerks(p), choices = [];
  while (choices.length < 3 && pool.length) choices.push(pool.splice(Math.random() * pool.length | 0, 1)[0]);
  if (!choices.length) { startWarp(); return; }
  g.choices = choices; mode = 'perk';
  showOverlay(`<div class="panel center"><div class="kicker green">SECTOR ${g.sector} CLEAR</div><h2>CHOOSE AN UPGRADE</h2>
    ${choices.map((c, i) => { const n = p.perks[c.id] || 0; return `<button class="card" data-act="perk:${i}"><b>${c.name}</b><small>${c.desc}</small><em>${c.stat(p)}</em><i>${c.max < 99 ? `LEVEL ${n} → ${n + 1} OF ${c.max}` : n ? `TAKEN ${n}×` : 'NEW'}</i></button>`; }).join('')}
    <div class="foot">ALL UPGRADES WORK AUTOMATICALLY · ONLY BULLET TIME NEEDS A TAP<br>THEY LAST UNTIL YOU DIE</div></div>`);
}
function startWarp() {
  hideOverlay(); mode = 'warp'; G.warp = 1.8; G.eb = []; sfx('warp');
  banner('FTL JUMP', 'SPOOLING TO SECTOR ' + (G.sector + 1), '#4ff0ff', 1.8);
}
function loadoutHtml(p) {
  const rows = [
    ['Lasers', p.streams], ['Damage', pct(p.dmg)], ['Shots/sec', p.rate.toFixed(1)], ['Hull', p.hp + ' / ' + p.maxHp],
    ['Missiles', p.missiles], ['Escorts', p.wings], ['Enemies per shot', p.pierce + 1], ['Bullet time', p.btDur.toFixed(1) + 's'],
  ];
  return `<div class="lbl">YOUR SHIP</div><div class="loadout">${rows.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>`;
}
function pauseGame() {
  if (mode !== 'play' && mode !== 'warp') return;
  G.resumeMode = mode; mode = 'paused';
  showOverlay(`<div class="panel center"><h2>PAUSED</h2>
    <div class="stats"><div><small>SECTOR</small><b>${G.sector}</b></div><div><small>SCORE</small><b>${fmt(G.score)}</b></div><div><small>DATA</small><b style="color:#39ffb0">◆ ${fmt(G.dataRun)}</b></div></div>
    ${loadoutHtml(G.p)}
    <button class="btn primary" data-act="resume">RESUME</button>${toggles()}
    <button class="btn danger" data-act="abort">ABORT LOOP</button><div class="foot">ABORTING STILL BANKS YOUR LOOP DATA</div></div>`);
}
function gameOver() {
  const g = G; mode = 'over';
  const mult = 1 + 0.1 * lvl('salvage'), earned = Math.floor(g.dataRun * mult);
  const newBest = g.score > save.best;
  save.data += earned; save.loops++; save.kills += g.kills; save.best = Math.max(save.best, g.score); persist();
  showOverlay(`<div class="panel center"><div class="kicker red">SIGNAL LOST</div><h2>LOOP #${save.loops} RESET</h2>
    ${newBest ? '<div class="newbest">NEW BEST SCORE</div>' : ''}
    <div class="stats"><div><small>SCORE</small><b>${fmt(g.score)}</b></div><div><small>SECTOR</small><b>${g.sector}</b></div><div><small>KILLS</small><b>${g.kills}</b></div></div>
    <div class="earn">+ ◆ ${fmt(earned)} LOOP DATA</div>
    ${mult > 1 ? `<div class="foot" style="margin-top:0">SALVAGE BONUS ×${mult.toFixed(1)}</div>` : ''}
    <p class="tip">${TIPS[Math.random() * TIPS.length | 0]}</p>
    <button class="btn primary" data-act="launch">RELAUNCH</button>
    <button class="btn" data-act="hangar">HANGAR${canAfford() ? ' <span class="dot">●</span>' : ''}</button>
    <button class="btn ghost" data-act="title">MAIN MENU</button></div>`);
}
ov.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  audioUnlock(); sfx('click');
  const [a, arg] = b.dataset.act.split(':');
  switch (a) {
    case 'launch': newRun(startSel); break;
    case 'cp': startSel = +arg; showTitle(); break;
    case 'hangar': showHangar(); break;
    case 'how': showHow(); break;
    case 'title': showTitle(); break;
    case 'buy': {
      const u = HANGAR.find(h => h.id === arg), c = cost(u);
      if (lvl(u.id) < u.max && save.data >= c) { save.data -= c; save.up[u.id] = lvl(u.id) + 1; persist(); sfx('power'); }
      showHangar(); break;
    }
    case 'perk': {
      const k = G.choices[+arg];
      if (k) {
        applyPerk(G.p, k); sfx('power'); startWarp();
        G.texts.push({ x: G.p.x, y: G.p.y - 50, txt: k.name.toUpperCase() + ' ONLINE', life: 2.2, col: '#39ff88', size: 15 });
      }
      break;
    }
    case 'resume': hideOverlay(); mode = G.resumeMode || 'play'; break;
    case 'abort': hideOverlay(); gameOver(); break;
    case 'snd': save.muted = !save.muted; persist(); if (master) master.gain.value = save.muted ? 0 : 0.8; b.textContent = 'SFX: ' + (save.muted ? 'OFF' : 'ON'); break;
    case 'mus': save.music = !save.music; persist(); if (musGain) musGain.gain.value = save.music ? 0.22 : 0; b.textContent = 'MUSIC: ' + (save.music ? 'ON' : 'OFF'); break;
  }
});

// ---------- input ----------
let ptrId = null, lpx = 0, lpy = 0;
const hitC = (c, x, y) => (x - c.x) ** 2 + (y - c.y) ** 2 < (c.r + 10) ** 2;
cv.addEventListener('pointerdown', e => {
  audioUnlock();
  if (mode !== 'play' && mode !== 'warp') return;
  const x = e.clientX, y = e.clientY;
  if (hitC(pauseBtn, x, y)) { pauseGame(); return; }
  if (mode === 'play' && hitC(btBtn, x, y)) { activateBT(); return; }
  if (ptrId === null) { ptrId = e.pointerId; lpx = x; lpy = y; try { cv.setPointerCapture(e.pointerId); } catch (_) {} }
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== ptrId) return;
  if (mode === 'play' || mode === 'warp') movePlayer(e.clientX - lpx, e.clientY - lpy);
  lpx = e.clientX; lpy = e.clientY;
});
const ptrUp = e => { if (e.pointerId === ptrId) ptrId = null; };
cv.addEventListener('pointerup', ptrUp); cv.addEventListener('pointercancel', ptrUp);
document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('#ov')) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); activateBT(); }
  if (e.code === 'KeyP' || e.code === 'Escape') { if (mode === 'paused') { hideOverlay(); mode = G.resumeMode || 'play'; } else pauseGame(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pauseGame(); if (AC) AC.suspend(); }
  else if (AC) AC.resume();
});

// ---------- layout ----------
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  // iOS home-screen apps can report a short height, leaving a dead strip at the bottom.
  // In portrait standalone mode the app owns the whole screen, so use the screen size.
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (standalone && W < H && screen.height > H) H = screen.height;
  document.body.style.height = H + 'px';
  cv.width = W * DPR | 0; cv.height = H * DPR | 0; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const s = getComputedStyle(document.getElementById('safe'));
  SAFE = { t: parseFloat(s.paddingTop) || 0, b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0, r: parseFloat(s.paddingRight) || 0 };
  FW = Math.min(W, 540); FX = (W - FW) / 2;
  pauseBtn = { x: W - SAFE.r - 32, y: SAFE.t + 28, r: 20 };
  btBtn = { x: W - SAFE.r - 50, y: H - SAFE.b - 54, r: 34 };
  initStars(); makeNebula(G ? G.sector : 1);
  if (G) { G.p.x = clamp(G.p.x, 14, FW - 14); G.p.y = clamp(G.p.y, SAFE.t + 70, H - SAFE.b - 24); }
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 300));
addEventListener('load', () => setTimeout(resize, 300));

// Offline support: the service worker keeps a copy of the game on the device.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now; if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  frameDt = dt; clock += dt;
  if (mode === 'play' || mode === 'warp' || mode === 'dying') updateGame(dt);
  updStars(dt, starBoost());
  draw();
  requestAnimationFrame(frame);
}
buildSprites(); resize(); showTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
